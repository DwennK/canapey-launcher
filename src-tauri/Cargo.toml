[package]
name = "canapey-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A quiet, controller-first Windows living-room launcher"
license = "MIT"

[lib]
name = "canapey_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart", "dep:tauri-plugin-updater", "dep:rfd", "dep:image", "dep:log", "dep:tauri-plugin-log"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
url = "2"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-log = { version = "2", optional = true }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
log = { version = "0.4", optional = true }

[target.'cfg(windows)'.dependencies]
gilrs = "0.11"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Memory", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Graphics_Dwm", "Win32_Security"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
