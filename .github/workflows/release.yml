name: Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build from the default branch workflow
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && startsWith(inputs.tag, 'v'))
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.RELEASE_TAG == 'v0.11.0' && '12.15.0' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Validate all versions and tag
        run: node scripts/version.mjs check "--tag=$env:RELEASE_TAG"
      - run: pnpm run build
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - name: Configure signed update endpoint
        run: pnpm run release:configure
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      # This existing tag predates the pnpm build hook. Keep its tracked source intact.
      - name: Use pnpm for the v0.11.0 frontend build hook
        if: env.RELEASE_TAG == 'v0.11.0'
        run: |
          node -e "const fs = require('node:fs'); const path = 'src-tauri/tauri.release.conf.json'; const config = JSON.parse(fs.readFileSync(path)); config.build = { beforeBuildCommand: 'pnpm run build' }; fs.writeFileSync(path, JSON.stringify(config));"
      - name: Require signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.' }
      - name: Build, sign update artifacts and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Canapey Launcher v__VERSION__
          releaseBody: "Windows 11 x64. Signed updates. Review the release notes before publishing."
          releaseDraft: true
          prerelease: ${{ startsWith(env.RELEASE_TAG, 'v0.') }}
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Attach installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download $env:RELEASE_TAG --pattern '*.exe' --dir release-checksums --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Installer download verification failed' }
          $files = @(Get-ChildItem release-checksums/*.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          gh release upload $env:RELEASE_TAG SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Checksum upload failed' }
