name: Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Validate all versions and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs check "--tag=$env:RELEASE_TAG"
      - run: npm run build
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - name: Build experimental installer and create draft prerelease
        if: startsWith(github.ref_name, 'v0.')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Canapey Launcher v__VERSION__ — version de test
          releaseBody: "Prérelease expérimentale pour Windows 11 x64. Installateur sans signature Authenticode et sans mise à jour intégrée. Voir CHANGELOG.md et docs/VALIDATION.md."
          releaseDraft: true
          prerelease: true
          args: --target x86_64-pc-windows-msvc --bundles nsis
          includeUpdaterJson: false
      - name: Configure signed update endpoint
        if: ${{ !startsWith(github.ref_name, 'v0.') }}
        run: npm run release:configure
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      - name: Build, sign update artifacts and create draft release
        if: ${{ !startsWith(github.ref_name, 'v0.') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Canapey Launcher v__VERSION__
          releaseBody: "Windows 11 x64. Voir les notes de version avant publication."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
      - name: Attach installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download $env:RELEASE_TAG --pattern '*.exe' --dir release-checksums --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Installer download verification failed' }
          $files = @(Get-ChildItem release-checksums/*.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
          gh release upload $env:RELEASE_TAG SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Checksum upload failed' }
